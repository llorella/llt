[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llt"
version = "0.1.0"
description = "An auditable CLI and SDK for message logs and explicit Python plugins"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "LLT Project Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
providers = [
    "anthropic>=0.76.0",
    "openai>=1.93.0",
]
dev = [
    "pytest>=7.3.1",
    "black>=23.3.0",
    "isort>=5.12.0",
    "mypy>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/llorella/llt"
Issues = "https://github.com/llorella/llt/issues"

[project.scripts]
llt = "llt.cli.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100
